name: 'Build UnityPackage.'

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  unitypackage:
    runs-on: ubuntu-latest

    name: 'Build UnityPackage.'

    permissions:
      contents: write

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: 'true'

      - name: 'Install Unity'
        uses: Yellow-Dog-Man/composite-actions-templates/.github/actions/unity-download@e459a9981778b3c6cd974bf69c2cf8209a5d7ea9 # Main
        with:
          version: '6000.3.10f1'
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
          UNITY_CI_LICENSE_ID: ${{ secrets.UNITY_CI_LICENSE_ID }}
          UNITY_CI_USERNAME: ${{ secrets.UNITY_CI_USERNAME }}
          UNITY_CI_PASSWORD: ${{ secrets.UNITY_CI_PASSWORD }}

      - name: 'Build Package'
        run: /home/runner/Unity/Hub/Editor/6000.3.10f1/Editor/Unity -quit -batchmode -nographics -projectPath $(pwd) -executeMethod ResoniteSDK_Builder.BuildUnityPackage
  
      - name: 'Upload packages'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # V7.0.1
        with:
          name: 'Resonite.UnitySDK'
          path: Builds/*.unitypackage

      - name: 'Publish package to release if any.'
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: 'Builds/ResoniteSDK.unitypackage'
